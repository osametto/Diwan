name: Build Diwan test APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Verify Android adapter
        run: node tools/check_bridge_node.cjs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Reuse test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diwan-test-signing-key-v1
      - name: Build test APK without repository secrets
        env:
          STUDIO_VERSION_CODE: ${{ github.run_number }}
        run: |
          export STUDIO_VERSION_CODE=$((23000 + STUDIO_VERSION_CODE))
          gradle --no-daemon --max-workers=2 --stacktrace :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Diwan-Android-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
