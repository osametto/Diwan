name: Build signed Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35 cmdline-tools;latest'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare and verify mobile assets
        env:
          CHROMIUM_CHANNEL: chromium
          DIWAN_CAPTURE: '0'
        run: |
          python3 tools/wrap_studio.py Diwan-1.2.12.html
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDIO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Add the STUDIO signing secrets from your private signing kit.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studio-release.jks"
      - name: Compile and sign
        env:
          STUDIO_KEYSTORE: ${{ runner.temp }}/studio-release.jks
          STUDIO_STORE_PASSWORD: ${{ secrets.STUDIO_STORE_PASSWORD }}
          STUDIO_KEY_PASSWORD: ${{ secrets.STUDIO_KEY_PASSWORD }}
          STUDIO_VERSION_CODE: ${{ github.run_number }}
        run: |
          export STUDIO_VERSION_CODE=$((120200 + STUDIO_VERSION_CODE))
          gradle --no-daemon --max-workers=2 assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: DIWAN-Android-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/studio-release.jks"
