name: Build Android preview APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35 cmdline-tools;latest'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare and verify mobile assets
        env:
          CHROMIUM_CHANNEL: chromium
          DIWAN_CAPTURE: '0'
        run: |
          if [ -f "Diwan-1.2.12.html" ]; then
            python3 tools/wrap_studio.py Diwan-1.2.12.html
          else
            echo "Original HTML is absent; verifying the committed prepared Android assets instead."
            for asset in index.html android-bridge.js mobile-shell.js mobile-shell.css; do
              if [ ! -s "app/src/main/assets/$asset" ]; then
                echo "::error::Missing app/src/main/assets/$asset. Upload the complete GitHub source ZIP contents, including app, tools, package files and .github."
                exit 1
              fi
            done
          fi
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Compile debug preview (no secrets required)
        env:
          STUDIO_VERSION_CODE: ${{ github.run_number }}
        run: |
          export STUDIO_VERSION_CODE=$((120200 + STUDIO_VERSION_CODE))
          gradle --no-daemon --max-workers=2 assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DIWAN-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
